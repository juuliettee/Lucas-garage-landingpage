<!-- This is the login screen for the admin application file for the Lucas Garage landing page.
must be mobile responsive -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mechanic Portal Login - Luca's Garage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='img/logo.png') }}">
</head>

<body class="bg-[#0B1117] text-slate-100 min-h-screen flex items-center justify-center px-4 font-sans antialiased">
    <div class="max-w-md w-full bg-[#141E28] rounded-3xl shadow-2xl p-8 sm:p-10 border border-[#243344]">
        <div class="text-center mb-8">
            <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Luca's Garage Logo"
                class="w-16 h-16 rounded-2xl mx-auto mb-4 shadow-sm border border-[#243344] object-cover">
            <h2 class="text-2xl sm:text-3xl font-black text-slate-50">Workshop Portal</h2>
            <p class="text-xs text-slate-400 mt-2">Sign in to manage car inventory and viewings</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div class="mb-6">
            {% for category, message in messages %}
            <div class="p-3 rounded-xl text-xs font-semibold mb-2 {% if category == 'success' %}bg-emerald-500/10 text-emerald-400 border border-emerald-500/25{% elif category == 'danger' %}bg-rose-500/10 text-rose-400 border border-rose-500/25{% else %}bg-amber-500/10 text-amber-400 border border-amber-500/25{% endif %}">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}

        <form action="{{ url_for('login') }}" method="POST" class="space-y-5">
            <div>
                <label class="block text-xs font-bold text-slate-300 mb-1">Username</label>
                <input type="text" name="username" required
                    class="w-full px-4 py-3 rounded-xl bg-[#0B1117] border border-[#243344] text-slate-100 placeholder-slate-500 focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none text-sm transition">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-300 mb-1">Password</label>
                <input type="password" name="password" required
                    class="w-full px-4 py-3 rounded-xl bg-[#0B1117] border border-[#243344] text-slate-100 placeholder-slate-500 focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none text-sm transition">
            </div>
            <button type="submit"
                class="w-full bg-amber-500 hover:bg-amber-600 text-[#0B1117] font-bold py-3.5 rounded-xl shadow-lg shadow-amber-500/10 transition text-sm">
                Sign In
            </button>
        </form>

        <div class="mt-6 text-center">
            <a href="{{ url_for('home') }}" class="text-xs text-slate-400 hover:text-amber-400 font-semibold transition">
                &larr; Return to main site
            </a>
        </div>
    </div>
</body>

</html>
